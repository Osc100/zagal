name: Release

# Push a tag like v1.0.0 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v6
      - run: mise run ndk
      - run: mise run test
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ZAGAL_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ZAGAL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: mise run release
        env:
          ZAGAL_PASSWORD: ${{ secrets.ZAGAL_PASSWORD }}
      # The notes are the version's changelog, as the app stores show it (a
      # missing one fails the release), above GitHub's list of merged PRs.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="zagal-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$code.txt" \
            --generate-notes
