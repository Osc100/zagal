[tools]
java = "zulu-21"
# Builds libghostty-vt from source (terminal/ghostty); ghostty pins the minor version.
zig = "0.17.0"

[env]
# CI runners bring their own SDK; locally, Android Studio's default place.
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=env.HOME ~ '/Android/Sdk') }}"
_.path = ["{{ env.ANDROID_HOME }}/platform-tools", "{{ env.ANDROID_HOME }}/emulator"]

[tasks.ndk]
description = "Install the NDK version terminal/build.gradle.kts pins"
run = '''
version=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' terminal/build.gradle.kts)
"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$version"
'''

[tasks.test]
description = "Protocol and app unit tests"
run = "./gradlew :core:jvmTest :app:testDebugUnitTest"

[tasks.build]
description = "Debug APK"
run = "./gradlew :app:assembleDebug"

[tasks.release]
description = "Release APK, signed when ZAGAL_KEYSTORE and ZAGAL_PASSWORD are set (CI)"
run = "./gradlew :app:assembleRelease"

[tasks.e2e]
description = "End-to-end flows (Maestro) on the connected device or emulator, against a throwaway herdr-core"
tools = { maestro = "cli-2.12.0" }
run = "e2e/run.sh"
